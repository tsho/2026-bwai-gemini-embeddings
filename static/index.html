<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cross-Modal Search</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff; color: #333; }

  /* Header */
  .header { text-align: center; padding: 60px 24px 20px; }
  .header h1 { font-size: 2.4rem; margin-bottom: 8px; }
  .header h1 span:nth-child(1) { color: #4285f4; }
  .header h1 span:nth-child(2) { color: #ea4335; }
  .header h1 span:nth-child(3) { color: #fbbc05; }
  .header h1 span:nth-child(4) { color: #4285f4; }
  .header h1 span:nth-child(5) { color: #34a853; }
  .header h1 span:nth-child(6) { color: #ea4335; }
  .header p { color: #999; font-size: 14px; }

  /* Search box */
  .search-box { max-width: 600px; margin: 24px auto 0; padding: 0 24px; }
  .search-input-wrap {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid #ddd; border-radius: 24px; padding: 8px 16px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    transition: box-shadow 0.2s;
  }
  .search-input-wrap:focus-within { box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
  .search-input-wrap input[type="text"] {
    flex: 1; border: none; outline: none; font-size: 16px; padding: 8px 0;
  }
  .search-input-wrap .image-label {
    cursor: pointer; padding: 6px; border-radius: 50%; color: #4285f4; font-size: 20px;
    display: flex; align-items: center;
  }
  .search-input-wrap .image-label:hover { background: #f0f0f0; }
  .search-input-wrap input[type="file"] { display: none; }
  .search-btn {
    background: #4285f4; color: #fff; border: none; border-radius: 50%;
    width: 40px; height: 40px; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .search-btn:hover { background: #3367d6; }
  .search-btn:disabled { background: #ccc; cursor: not-allowed; }

  .image-preview { max-width: 600px; margin: 12px auto 0; padding: 0 24px; }
  .image-preview .tag {
    display: inline-flex; align-items: center; gap: 6px;
    background: #e8f0fe; color: #4285f4; padding: 4px 12px; border-radius: 16px; font-size: 13px;
  }
  .image-preview .tag button {
    background: none; border: none; cursor: pointer; color: #4285f4; font-size: 16px; line-height: 1;
  }

  /* Status */
  .status { text-align: center; margin-top: 12px; font-size: 13px; color: #666; min-height: 20px; }

  /* Results */
  .results-wrap { max-width: 900px; margin: 24px auto; padding: 0 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 640px) { .results-wrap { grid-template-columns: 1fr; } }
  .results-col h3 { font-size: 14px; color: #999; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  .results-col { display: flex; flex-direction: column; gap: 12px; }
  .card { border: 1px solid #e0e0e0; border-radius: 12px; padding: 16px; transition: box-shadow 0.15s; }
  .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .card .meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .card .score { font-weight: bold; color: #4285f4; font-size: 14px; }
  .card .type {
    display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase;
  }
  .card .type.text { background: #e8f0fe; color: #4285f4; }
  .card .type.image { background: #fce8e6; color: #ea4335; }
  .card .content { color: #555; font-size: 15px; }
  .card .content img { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 4px; display: block; }

  /* Register panel */
  .register-toggle {
    max-width: 600px; margin: 32px auto 0; padding: 0 24px; text-align: center;
  }
  .register-toggle button {
    background: none; border: 1px solid #ddd; border-radius: 8px; padding: 8px 16px;
    color: #666; font-size: 13px; cursor: pointer;
  }
  .register-toggle button:hover { background: #f8f8f8; }
  .register-panel {
    max-width: 600px; margin: 12px auto 40px; padding: 0 24px;
    display: none;
  }
  .register-panel.open { display: block; }
  .register-panel .inner {
    background: #f8f9fa; border-radius: 12px; padding: 20px;
  }
  .register-panel h3 { font-size: 14px; color: #666; margin-bottom: 12px; }
  .register-panel .form-group { display: flex; gap: 8px; margin-bottom: 10px; }
  .register-panel input[type="text"], .register-panel input[type="file"] {
    flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px;
  }
  .register-panel button.reg-btn {
    padding: 8px 16px; border: none; border-radius: 8px; background: #34a853; color: #fff;
    font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .register-panel button.reg-btn:hover { background: #2d8e47; }
  .register-status { font-size: 12px; color: #666; margin-top: 4px; }
  .db-count { text-align: center; font-size: 13px; color: #bbb; margin-top: 8px; }
</style>
</head>
<body>

<div class="header">
  <h1><span>C</span><span>r</span><span>o</span><span>s</span><span>s</span><span>-Modal</span> Search</h1>
  <p>Gemini Embedding 2 — Text & Image Cross-Modal Search</p>
  <p class="db-count" style="margin-top:12px;">Indexed: <span id="dbTextCountTop">0</span> texts / <span id="dbImageCountTop">0</span> images</p>
</div>

<div class="search-box">
  <div class="search-input-wrap">
    <input type="text" id="searchText" placeholder="Search by text or image...">
    <label class="image-label" title="Search by image">
      &#128247;
      <input type="file" id="searchImage" accept="image/*">
    </label>
    <button class="search-btn" id="searchBtn" title="Search">&#8594;</button>
  </div>
</div>

<div class="image-preview" id="imagePreview" style="display:none;">
  <span class="tag">
    <span id="imageFileName"></span>
    <button onclick="clearSearchImage()">&times;</button>
  </span>
</div>

<div class="status" id="searchStatus"></div>

<div class="results-wrap" id="resultsWrap" style="display:none;">
  <div class="results-col">
    <h3>Text Results</h3>
    <div id="textResults"></div>
  </div>
  <div class="results-col">
    <h3>Image Results</h3>
    <div id="imageResults"></div>
  </div>
</div>

<div class="register-toggle">
  <button onclick="toggleRegister()">+ Register Data</button>
  <p class="db-count">Indexed: <span id="dbTextCount">0</span> texts / <span id="dbImageCount">0</span> images</p>
</div>

<div class="register-panel" id="registerPanel">
  <div class="inner">
    <h3>Register new data to the index</h3>
    <div class="form-group">
      <input type="text" id="indexText" placeholder="Text to register...">
      <button class="reg-btn" onclick="indexTextItem()">+ Text</button>
    </div>
    <div class="form-group">
      <input type="file" id="indexImage" accept="image/*">
      <button class="reg-btn" onclick="indexImageItem()">+ Image</button>
    </div>
    <div class="register-status" id="indexStatus"></div>
  </div>
</div>

<script>
const indexStatus = document.getElementById("indexStatus");
const searchStatus = document.getElementById("searchStatus");
const resultsWrap = document.getElementById("resultsWrap");
const textResultsDiv = document.getElementById("textResults");
const imageResultsDiv = document.getElementById("imageResults");
const searchTextEl = document.getElementById("searchText");
const searchImageEl = document.getElementById("searchImage");
const searchBtn = document.getElementById("searchBtn");
const imagePreview = document.getElementById("imagePreview");
const imageFileName = document.getElementById("imageFileName");

let selectedSearchFile = null;

async function fetchStats() {
  try {
    const res = await fetch("/api/stats");
    const data = await res.json();
    document.getElementById("dbTextCountTop").textContent = data.text_count;
    document.getElementById("dbImageCountTop").textContent = data.image_count;
    document.getElementById("dbTextCount").textContent = data.text_count;
    document.getElementById("dbImageCount").textContent = data.image_count;
  } catch (e) { /* ignore */ }
}
fetchStats();

// Search by image: show preview on file select and trigger search
searchImageEl.addEventListener("change", () => {
  const file = searchImageEl.files[0];
  if (!file) return;
  selectedSearchFile = file;
  imageFileName.textContent = file.name;
  imagePreview.style.display = "block";
  searchByImage(file);
});

function clearSearchImage() {
  selectedSearchFile = null;
  searchImageEl.value = "";
  imagePreview.style.display = "none";
}

// Search button click
searchBtn.addEventListener("click", doSearch);

// Enter key in text field
searchTextEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") doSearch();
});

function doSearch() {
  const text = searchTextEl.value.trim();
  if (selectedSearchFile) {
    searchByImage(selectedSearchFile);
  } else if (text) {
    searchByText(text);
  }
}

async function searchByText(text) {
  searchStatus.textContent = "Searching...";
  searchBtn.disabled = true;
  try {
    const form = new FormData();
    form.append("query_text", text);
    const res = await fetch("/api/search", { method: "POST", body: form });
    const data = await res.json();
    renderResults(data);
    searchStatus.textContent = "";
  } catch (e) {
    searchStatus.textContent = "Error: " + e.message;
  } finally {
    searchBtn.disabled = false;
  }
}

async function searchByImage(file) {
  searchStatus.textContent = "Searching...";
  searchBtn.disabled = true;
  try {
    const form = new FormData();
    form.append("query_image", file);
    const res = await fetch("/api/search", { method: "POST", body: form });
    const data = await res.json();
    renderResults(data);
    searchStatus.textContent = "";
  } catch (e) {
    searchStatus.textContent = "Error: " + e.message;
  } finally {
    searchBtn.disabled = false;
  }
}

function renderResults(data) {
  const texts = data.text_results || [];
  const images = data.image_results || [];
  if (texts.length === 0 && images.length === 0) {
    resultsWrap.style.display = "none";
    return;
  }
  resultsWrap.style.display = "grid";
  textResultsDiv.innerHTML = texts.length === 0
    ? '<p style="color:#999;">No text results.</p>'
    : texts.map((r, i) => renderCard(r, i)).join("");
  imageResultsDiv.innerHTML = images.length === 0
    ? '<p style="color:#999;">No image results.</p>'
    : images.map((r, i) => renderCard(r, i)).join("");
}

function renderCard(r, i) {
  let contentHtml;
  if (r.type === "image" && r.image_url) {
    contentHtml = `<img src="${escapeHtml(r.image_url)}" alt="${escapeHtml(r.content)}"><div style="font-size:12px;color:#999;margin-top:4px;">${escapeHtml(r.content)}</div>`;
  } else {
    contentHtml = escapeHtml(r.content);
  }
  return `
  <div class="card">
    <div class="meta">
      <span class="score">#${i + 1} &middot; ${(r.score * 100).toFixed(1)}%</span>
      <span class="type ${r.type}">${r.type}</span>
    </div>
    <div class="content">${contentHtml}</div>
  </div>`;
}

function escapeHtml(text) {
  const d = document.createElement("div");
  d.textContent = text;
  return d.innerHTML;
}

// Register panel
function toggleRegister() {
  document.getElementById("registerPanel").classList.toggle("open");
}

async function indexTextItem() {
  const text = document.getElementById("indexText").value.trim();
  if (!text) return;
  indexStatus.textContent = "Registering...";
  try {
    const form = new FormData();
    form.append("text", text);
    const res = await fetch("/api/index/text", { method: "POST", body: form });
    const data = await res.json();
    fetchStats();
    indexStatus.textContent = "Text registered.";
    document.getElementById("indexText").value = "";
  } catch (e) {
    indexStatus.textContent = "Error: " + e.message;
  }
}

async function indexImageItem() {
  const file = document.getElementById("indexImage").files[0];
  if (!file) return;
  indexStatus.textContent = "Registering...";
  try {
    const form = new FormData();
    form.append("file", file);
    const res = await fetch("/api/index/image", { method: "POST", body: form });
    const data = await res.json();
    fetchStats();
    indexStatus.textContent = "Image registered: " + file.name;
    document.getElementById("indexImage").value = "";
  } catch (e) {
    indexStatus.textContent = "Error: " + e.message;
  }
}
</script>
</body>
</html>
